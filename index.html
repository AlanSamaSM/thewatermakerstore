    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .logo-track { display: flex; align-items: center; animation: marquee 28s linear infinite; width: max-content; gap: 0; }

    .logo-strip { overflow: hidden; -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%); mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%); }

    /* ── FLOATING WHATSAPP ─────────────────────── */
    .wa-float {
      position: fixed; bottom: 18px; right: 18px; z-index: 90;
      width: 58px; height: 58px; border-radius: 50%;
      background: #25D366; color: #fff;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(37,211,102,0.45), 0 2px 8px rgba(0,0,0,0.18);
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s;
    }
    .wa-float:hover { transform: scale(1.08); box-shadow: 0 8px 22px rgba(37,211,102,0.55), 0 2px 10px rgba(0,0,0,0.22); }
    .wa-float::before {
      content: ''; position: absolute; inset: 0;
      border-radius: 50%; background: #25D366;
      animation: wa-ring 2.2s ease-out infinite; z-index: -1;
    }
    @keyframes wa-ring {
      0%   { transform: scale(1);   opacity: .55; }
      100% { transform: scale(1.8); opacity: 0;   }
    }
    @media (min-width: 768px) {

    .faq-item .faq-answer {
